name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libmicrohttpd-dev libcjson-dev
      - name: Reject tracked Microsoft-owned files
        run: ./tools/check_no_microsoft_files.sh
      - name: Build engine and server
        run: make server
      - name: Run the data-free suite
        run: make test

  image:
    name: Publish image
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record the engine commit
        id: engine
        run: echo "sha=$(git ls-tree HEAD third_party/ms-sam-mike-mary-decomp | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=sapi-serve
            org.opencontainers.image.description=HTTP text-to-speech for SAPI 5 voices
            io.github.icedream.sapi-serve.engine=${{ steps.engine.outputs.sha }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            ENGINE_COMMIT=${{ steps.engine.outputs.sha }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  sign:
    name: Sign image
    needs: image
    runs-on: ubuntu-latest
    steps:
      # keyless: the signature is bound to this workflow's OIDC identity, so verifying it
      # means trusting this repository and this workflow file, not a key someone could copy
      - name: Install cosign
        run: |
          curl -sSLo cosign https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          chmod +x cosign && sudo mv cosign /usr/local/bin/
      - name: Sign the image
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ needs.image.outputs.digest }}"
